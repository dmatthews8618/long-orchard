# Runs the engine's guarantees on every change to the code.
name: Engine tests

on:
  push:
    paths: ['engine/**', 'tools/**', 'test/**']
  pull_request:
    paths: ['engine/**', 'tools/**', 'test/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
